<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kindle Anki 导入</title>
<style>
  :root {
    --paper: #f3f4f2;
    --sheet: #ffffff;
    --ink: #17191c;
    --graphite: #5a6068;
    --rule: #d9dcdf;
    --rule-strong: #b9bec4;
    --action: #1f4fa8;
    --action-ink: #ffffff;
    --action-soft: #e6ecf8;
    --ok: #1e6b45;
    --ok-soft: #e4f1ea;
    --danger: #b42318;
    --danger-soft: #fbe9e7;
    --eink: #ebebe5;
    --eink-ink: #1d1d1b;
    --eink-muted: #6c6c66;
    --bezel: #26282c;
    --radius-sm: 8px;
    --radius: 14px;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans",
      "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131416;
      --sheet: #1c1e21;
      --ink: #eceef0;
      --graphite: #a2a8b0;
      --rule: #2d3035;
      --rule-strong: #454950;
      --action: #8db0f4;
      --action-ink: #0d1a33;
      --action-soft: #1d2840;
      --ok: #7fcfa3;
      --ok-soft: #16271e;
      --danger: #f2948a;
      --danger-soft: #2e1916;
      --bezel: #050506;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Header: who we are and whether the Kindle answers. */
  header { padding: 22px 0 14px; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0; letter-spacing: 0.01em; }
  .status { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; font-size: 14px; color: var(--graphite); }
  .status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--rule-strong);
  }
  .status[data-state="ok"]::before { background: var(--ok); }
  .status[data-state="down"] { color: var(--danger); }
  .status[data-state="down"]::before { background: var(--danger); }

  /* Tabs. */
  .tabs {
    position: sticky; top: 0; z-index: 2;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 4px; margin: 0 -4px 18px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  .tab {
    min-height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent;
    font-size: 15px; color: var(--graphite); cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); font-weight: 600;
    box-shadow: 0 0 0 1px var(--rule); }
  .tab .count { font-variant-numeric: tabular-nums; color: var(--graphite); font-weight: 400; margin-left: 4px; }

  /* Steps of the import: a real sequence, so they are numbered. */
  .step { margin: 0 0 26px; }
  .step-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .step-no {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: inline-grid; place-items: center;
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
    border: 1.5px solid var(--ink); position: relative; top: 2px;
  }
  .step h2 { font-size: 17px; line-height: 1.4; margin: 0; }
  .step[data-locked] { opacity: 0.45; }
  .step[data-locked] .step-body { pointer-events: none; }
  .hint { font-size: 14px; color: var(--graphite); margin: 6px 0 0; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 120px; padding: 18px; text-align: center; cursor: pointer;
    background: var(--sheet); border: 1.5px dashed var(--rule-strong); border-radius: var(--radius);
  }
  .drop:hover, .drop[data-over] { border-color: var(--action); background: var(--action-soft); }
  .drop strong { font-size: 17px; color: var(--action); }
  .drop span { font-size: 14px; color: var(--graphite); word-break: break-all; }
  .drop[data-picked] { border-style: solid; }
  .drop[data-picked] strong { color: var(--ink); }

  label.field-label { display: block; font-size: 14px; color: var(--graphite); margin: 0 0 4px; }
  input[type="text"], input[type="password"], input[type="url"] {
    width: 100%; min-height: 46px; padding: 10px 12px; font-size: 16px;
    background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: var(--radius-sm);
  }
  input::placeholder { color: var(--graphite); opacity: 0.8; }
  .title-row { margin-bottom: 14px; }

  /* One note type: its fields with front/back toggles, then the preview. */
  .model { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 14px; margin: 0 0 14px; }
  .model h3 { font-size: 16px; margin: 0 0 4px; word-break: break-all; }
  .model .need { font-size: 13px; color: var(--graphite); margin: 0 0 8px; }
  .model[data-incomplete="false"] .need { color: var(--ok); }
  .model[data-flagged] { border-color: var(--danger); }
  .model[data-flagged] .need { color: var(--danger); font-weight: 600; }
  .fields { list-style: none; margin: 0; padding: 0; }
  .fields li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--rule); }
  .field-name { font-size: 15px; font-weight: 600; word-break: break-all; }
  .field-sample { grid-column: 1 / -1; font-size: 13px; color: var(--graphite); word-break: break-all;
    margin-top: -2px; }
  .sides { display: flex; gap: 6px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span {
    display: inline-grid; place-items: center; min-width: 52px; min-height: 40px; padding: 0 10px;
    border: 1px solid var(--rule-strong); border-radius: 999px; font-size: 14px; color: var(--graphite);
  }
  .chip input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
  .chip input:focus-visible + span { outline: 3px solid var(--action); outline-offset: 2px; }

  /* The Kindle preview: the one bold element on the page. */
  .preview { display: flex; justify-content: center; margin: 16px 0 4px; }
  .kindle {
    width: min(100%, 300px); padding: 14px 12px 26px; border-radius: 22px; background: var(--bezel);
    box-shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.6);
  }
  .screen { background: var(--eink); color: var(--eink-ink); border-radius: 3px; padding: 10px 14px 16px;
    min-height: 220px; font-family: var(--serif); }
  .screen .bar { display: flex; justify-content: space-between; font: 11px/1.4 var(--sans);
    color: var(--eink-muted); border-bottom: 1px solid #c9c9c2; padding-bottom: 6px; margin-bottom: 12px; }
  .screen .front { font-size: 18px; line-height: 1.45; white-space: pre-line; word-break: break-word; }
  .screen .divider { border-top: 1px solid #8f8f88; margin: 12px 0 10px; }
  .screen .back { font-size: 15px; line-height: 1.5; white-space: pre-line; word-break: break-word;
    color: #3a3a37; }
  .screen .empty { color: var(--eink-muted); font-style: normal; font-size: 14px; }
  .preview-caption { text-align: center; font-size: 13px; color: var(--graphite); margin: 6px 0 0; }

  /* Buttons. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 0 20px; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid var(--rule-strong); background: var(--sheet); font-size: 16px;
  }
  .btn.primary { width: 100%; min-height: 54px; background: var(--action); border-color: var(--action);
    color: var(--action-ink); font-size: 17px; font-weight: 600; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--action); padding: 0 8px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.small { min-height: 40px; padding: 0 14px; font-size: 15px; }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  /* Messages. */
  .note { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; margin: 12px 0 0;
    white-space: pre-line; word-break: break-all; }
  .note.ok { background: var(--ok-soft); color: var(--ok); }
  .note.err { background: var(--danger-soft); color: var(--danger); }
  .note.info { background: var(--action-soft); color: var(--ink); }
  .note:empty { display: none; }
  .inapp { background: var(--action-soft); border: 1px solid var(--action); border-radius: var(--radius);
    padding: 12px 14px; margin: 0 0 16px; font-size: 15px; }
  .inapp strong { display: block; font-size: 16px; margin-bottom: 2px; }

  /* Packs already on the Kindle. */
  .packs { list-style: none; margin: 0; padding: 0; }
  .pack { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 12px 14px; margin: 0 0 10px; }
  .pack-row { display: flex; align-items: center; gap: 12px; }
  .pack-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; word-break: break-all; }
  .pack-meta { font-size: 13px; color: var(--graphite); font-weight: 400; display: block; }
  .confirm { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 14px; }
  .confirm p { margin: 0 0 10px; color: var(--danger); }
  .confirm .row { display: flex; gap: 10px; }
  .empty-state { text-align: center; color: var(--graphite); padding: 32px 12px; font-size: 15px; }

  /* AI settings. */
  .form { display: grid; gap: 14px; }
  .code input { font-size: 26px; letter-spacing: 0.4em; text-align: center; font-variant-numeric: tabular-nums;
    max-width: 200px; }
  .lede { font-size: 15px; color: var(--graphite); margin: 0 0 16px; }

  /* Wide screens: the preview stays beside the fields while you tick them. */
  @media (min-width: 880px) {
    .wrap { max-width: 900px; }
    .model { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0 28px; align-items: start; }
    .model-preview { position: sticky; top: 72px; }
    .model-preview .preview { margin-top: 0; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn, .chip span, .tab { transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kindle Anki</h1>
    <p class="status" id="device-info" data-state="wait" role="status">正在连接 Kindle…</p>
  </header>

  <div class="inapp" id="inapp" role="note" hidden>
    <strong id="inapp-title"></strong>
    <span id="inapp-steps"></span>
  </div>

  <nav class="tabs" role="tablist" aria-label="页面">
    <button class="tab" role="tab" id="tab-import" aria-controls="view-import" aria-selected="true">导入</button>
    <button class="tab" role="tab" id="tab-packs" aria-controls="view-packs" aria-selected="false">卡包<span class="count" id="pack-count"></span></button>
    <button class="tab" role="tab" id="tab-ai" aria-controls="view-ai" aria-selected="false">AI</button>
  </nav>

  <main>
    <section id="view-import" role="tabpanel" aria-labelledby="tab-import">
      <div class="step" id="step1">
        <div class="step-head"><span class="step-no" aria-hidden="true">1</span><h2>选择 Anki 导出的 .apkg 文件</h2></div>
        <div class="step-body">
          <label class="drop" id="drop">
            <strong id="drop-title">点这里选择 .apkg 文件</strong>
            <span id="file-name">也可以把文件拖到这里</span>
            <input type="file" id="file" accept=".apkg" hidden>
          </label>
          <p class="hint">在电脑版 Anki 里导出时勾选「支持旧版本 Anki」。文件只在这个浏览器里转换，不会发到别的服务器。</p>
        </div>
      </div>

      <div class="step" id="step2" data-locked>
        <div class="step-head"><span class="step-no" aria-hidden="true">2</span><h2>选择正面和背面的字段</h2></div>
        <div class="step-body">
          <p class="hint" id="step2-hint">选好文件后，这里会列出每种笔记的字段。</p>
          <div id="mapping" hidden>
            <div class="title-row">
              <label class="field-label" for="pack-title-input">卡包名称</label>
              <input type="text" id="pack-title-input" placeholder="留空就用文件名">
            </div>
            <div id="models"></div>
          </div>
        </div>
      </div>

      <div class="step" id="step3" data-locked>
        <div class="step-head"><span class="step-no" aria-hidden="true">3</span><h2>发送到 Kindle</h2></div>
        <div class="step-body">
          <div class="actions">
            <button class="btn primary" id="send">转换并发送到 Kindle</button>
            <button class="btn quiet" id="download">只转换，下载 .zip</button>
          </div>
          <div class="note" id="report" role="status"></div>
        </div>
      </div>
    </section>

    <section id="view-packs" role="tabpanel" aria-labelledby="tab-packs" hidden>
      <ul class="packs" id="pack-list"></ul>
    </section>

    <section id="view-ai" role="tabpanel" aria-labelledby="tab-ai" hidden>
      <p class="lede">填好后保存到 Kindle，学习时就能用「AI 解析」。密钥只存在 Kindle 上，这个网页读不回来。局域网里是明文传输，只在家里的 Wi-Fi 用。</p>
      <div class="form">
        <div>
          <label class="field-label" for="ai-endpoint">接口地址</label>
          <input type="url" id="ai-endpoint" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label class="field-label" for="ai-model">模型名称</label>
          <input type="text" id="ai-model" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label class="field-label" for="ai-key">API key</label>
          <input type="password" id="ai-key" autocomplete="off">
        </div>
        <div>
          <label class="field-label" for="ai-prompt">系统提示词（可不填）</label>
          <input type="text" id="ai-prompt" autocomplete="off">
        </div>
        <div class="code">
          <label class="field-label" for="ai-code">配对码：Kindle 导入弹窗里的 4 位数</label>
          <input type="text" id="ai-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code">
        </div>
        <button class="btn primary" id="ai-save">保存到 Kindle</button>
      </div>
      <div class="note" id="ai-result" role="status"></div>
    </section>

    <div class="note err" id="error" role="alert"></div>
  </main>
</div>

<script src="apkg.js"></script>
<script src="convert.js"></script>
<script src="app.js"></script>
</body>
</html>
